
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفیق چت</title>
<style>
body{background:#101827;color:white;font-family:tahoma;text-align:center;padding:20px}
.box{max-width:450px;margin:50px auto;background:#1c2b42;padding:25px;border-radius:20px}
input,button{width:90%;padding:15px;margin:10px;border:0;border-radius:10px;font-size:16px}
button{background:#287cf0;color:white}
h1{color:#60a5fa}
</style>
</head>
<body>
<div class="box">
<h1>🎥 رفیق چت</h1>
<p>با دوستانت تماس تصویری بگیر!</p>
<input id="name" placeholder="نام شما">
<input id="room" placeholder="کد اتاق">
<button onclick="createRoom()">ساخت اتاق</button>
<button onclick="joinRoom()">ورود به تماس</button>
<button onclick="copyLink()">کپی لینک دعوت</button>
<p id="msg"></p>
</div>
<script>
function createRoom(){
let r="rafiq-"+Math.random().toString(36).slice(2,12);
document.getElementById("room").value=r;
document.getElementById("msg").innerText="اتاق ساخته شد!";
}
function joinRoom(){
let r=document.getElementById("room").value.trim();
let n=document.getElementById("name").value.trim();
if(!r){alert("کد اتاق را وارد کن");return;}
location.href="https://meet.jit.si/"+encodeURIComponent(r)+"#userInfo.displayName="+encodeURIComponent(n||"مهمان");
}
async function copyLink(){
let r=document.getElementById("room").value.trim();
if(!r){alert("اول اتاق بساز");return;}
let u="https://meet.jit.si/"+encodeURIComponent(r);
try{await navigator.clipboard.writeText(u);document.getElementById("msg").innerText="لینک کپی شد!";}
catch(e){document.getElementById("msg").innerText=u;}
}
</script>
</body>
</html>
